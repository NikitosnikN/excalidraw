name: Deploy Excalidraw Extended API

on:
  push:
    branches:
      - master-fork
    paths:
      - ".github/workflows/deploy-extended-api.yml"
      - "workers/excalidraw-extended-api/**"
      - "package.json"
      - "yarn.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy API Worker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master-fork'
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck API Worker
        run: yarn worker:extended-api:typecheck

      - name: Test API Worker
        run: yarn worker:extended-api:test

      - name: Verify Worker secret
        working-directory: workers/excalidraw-extended-api
        run: |
          npx wrangler secret list | grep -q TOKEN_HASH_PEPPER

      - name: Deploy API Worker
        working-directory: workers/excalidraw-extended-api
        run: npx wrangler deploy
